<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Youtube Jam Buddy</title>
  <style>
    :root {
      --bg: #15171c;
      --panel: #1f232b;
      --border: #2c313b;
      --text: #e6e8ed;
      --muted: #9aa3b2;
      --accent: #4ea1ff;
      --error: #ff6b6b;
      --success: #58d18b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    .layout {
      display: flex;
      gap: 24px;
      max-width: 1000px;
      margin: 0 auto;
      padding: 32px 20px;
    }
    .sidebar {
      width: 200px;
      flex-shrink: 0;
      position: sticky;
      top: 32px;
      align-self: flex-start;
      min-height: calc(100vh - 64px);
      max-height: calc(100vh - 64px);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }
    .sidebar-title {
      margin: 0 0 12px;
      font-size: 12px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .playlist-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .playlist-list button {
      width: 100%;
      background: transparent;
      border: 1px solid transparent;
      color: var(--text);
      padding: 8px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-family: inherit;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .playlist-list .playlist-title {
      flex: 1;
      text-align: left;
      word-break: break-word;
    }
    .playlist-list button:hover {
      background: var(--panel);
    }
    .playlist-list button.active {
      background: var(--panel);
      border-color: transparent;
      box-shadow: inset 3px 0 0 var(--accent);
      font-weight: 600;
      color: #fff;
    }
    .playlist-list .count {
      flex-shrink: 0;
      background: var(--border);
      color: var(--muted);
      font-size: 11px;
      padding: 2px 7px;
      border-radius: 999px;
      font-variant-numeric: tabular-nums;
      line-height: 1.4;
    }
    .playlist-list button.active .count {
      background: var(--accent);
      color: #fff;
    }
    .playlist-list button.drop-target {
      background: var(--panel);
      border-color: var(--success);
    }
    .new-list-btn,
    .export-btn,
    .import-btn {
      width: 100%;
      text-align: left;
      background: transparent;
      border: 1px dashed var(--border);
      color: var(--muted);
      padding: 8px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-family: inherit;
      margin-top: 8px;
    }
    .new-list-btn:hover,
    .export-btn:hover,
    .import-btn:hover {
      color: var(--accent);
      border-color: var(--accent);
    }
    .tools-row {
      display: flex;
      gap: 8px;
    }
    .tools-row .export-btn,
    .tools-row .import-btn {
      flex: 1;
      width: auto;
      text-align: center;
    }
    .sidebar-title-settings {
      margin-top: 24px;
    }
    .sidebar-bottom-anchor {
      margin-top: auto;
      padding-top: 24px;
    }
    .sidebar-setting {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 10px;
      color: var(--muted);
      font-size: 14px;
      cursor: pointer;
    }
    .toggle {
      position: relative;
      flex-shrink: 0;
      width: 32px;
      height: 18px;
      display: inline-block;
    }
    .toggle input {
      position: absolute;
      opacity: 0;
      width: 0;
      height: 0;
    }
    .toggle-slider {
      position: absolute;
      inset: 0;
      background: var(--border);
      border-radius: 999px;
      transition: background 0.15s ease;
    }
    .toggle-slider::before {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      width: 14px;
      height: 14px;
      background: var(--text);
      border-radius: 50%;
      transition: transform 0.15s ease;
    }
    .toggle input:checked + .toggle-slider {
      background: var(--accent);
    }
    .toggle input:checked + .toggle-slider::before {
      transform: translateX(14px);
    }
    .toggle input:focus-visible + .toggle-slider {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    main {
      flex: 1;
      min-width: 0;
    }
    @media (max-width: 800px) {
      .layout {
        flex-direction: column;
      }
      .sidebar {
        width: auto;
        position: static;
        max-height: none;
        overflow-y: visible;
      }
      .sidebar-bottom-anchor {
        margin-top: 24px;
        padding-top: 0;
      }
    }
    h1 {
      margin: 0 0 4px;
      font-size: 28px;
    }
    .subtitle {
      color: var(--muted);
      margin: 0 0 24px;
      font-size: 14px;
    }
    .add-form {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
    }
    .add-form input {
      flex: 1;
      padding: 10px 12px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      font-size: 14px;
    }
    .add-form input:focus {
      outline: none;
      border-color: var(--accent);
    }
    .add-form button {
      padding: 10px 18px;
      border-radius: 6px;
      border: 0;
      background: var(--accent);
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
    }
    .add-form button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .status {
      min-height: 20px;
      font-size: 13px;
      margin-bottom: 16px;
    }
    .status.error { color: var(--error); }
    .status.success { color: var(--success); }
    .status.info { color: var(--muted); }
    ul.list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    li.item {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      display: grid;
      grid-template-columns: 16px 240px 1fr;
      gap: 16px;
      align-items: center;
    }
    li.item.dragging { opacity: 0.4; }
    li.item.drop-above { box-shadow: 0 -3px 0 0 var(--accent); }
    li.item.drop-below { box-shadow: 0 3px 0 0 var(--accent); }
    .drag-handle {
      cursor: grab;
      color: var(--muted);
      user-select: none;
      font-size: 14px;
      line-height: 1;
      letter-spacing: -3px;
      text-align: center;
      align-self: stretch;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .drag-handle:hover { color: var(--text); }
    li.item.dragging .drag-handle { cursor: grabbing; }
    li.item[draggable="false"] .drag-handle { cursor: default; opacity: 0.3; }
    @media (max-width: 600px) {
      li.item { grid-template-columns: 1fr; }
      .drag-handle { display: none; }
    }
    li.item .item-thumb {
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 4px;
      background: #000;
      object-fit: cover;
      display: block;
    }
    .item-meta {
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-width: 0;
    }
    .item-title {
      font-weight: 600;
      font-size: 15px;
      word-break: break-word;
    }
    .item-url {
      color: var(--muted);
      font-size: 12px;
      word-break: break-all;
    }
    .item-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .item-actions button {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 6px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
    }
    .item-actions button.danger:hover {
      color: var(--error);
      border-color: var(--error);
    }
    .item-actions button.primary {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .speed-badge {
      display: inline-block;
      background: var(--border);
      color: var(--text);
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 10px;
      margin-left: 6px;
      vertical-align: middle;
    }
    .item-range {
      font-size: 12px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }
    .edit-form-row {
      display: flex;
      gap: 8px;
    }
    .edit-form-row label {
      flex: 1;
    }
    .edit-form-error {
      color: var(--error);
      font-size: 12px;
      min-height: 16px;
    }
    .edit-form {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .edit-form label {
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .edit-form input,
    .edit-form select {
      padding: 8px 10px;
      border-radius: 4px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
    }
    .edit-form input:focus,
    .edit-form select:focus {
      outline: none;
      border-color: var(--accent);
    }
    .list-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }
    .list-header h2 {
      margin: 0;
      font-size: 18px;
      font-weight: 600;
      flex: 1;
      word-break: break-word;
    }
    .list-header form {
      display: flex;
      gap: 8px;
      flex: 1;
      align-items: center;
    }
    .list-header form input {
      flex: 1;
      padding: 6px 10px;
      border-radius: 4px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
    }
    .list-header form input:focus {
      outline: none;
      border-color: var(--accent);
    }
    .empty {
      color: var(--muted);
      font-size: 14px;
      padding: 24px;
      text-align: center;
      border: 1px dashed var(--border);
      border-radius: 8px;
    }
    .jam-btn {
      width: 100%;
      padding: 14px;
      margin-bottom: 20px;
      border: 0;
      border-radius: 8px;
      background: linear-gradient(135deg, #8b5cf6, #06b6d4);
      color: #fff;
      font-weight: 700;
      font-size: 16px;
      letter-spacing: 0.5px;
      cursor: pointer;
    }
    .jam-btn:hover { filter: brightness(1.05); }
    .player-area {
      position: sticky;
      top: 0;
      z-index: 10;
      background: #000;
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 24px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }
    .player-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
    }
    .player-header strong { font-size: 14px; }
    .player-controls {
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .speed-control {
      display: flex;
      gap: 6px;
      align-items: center;
      font-size: 12px;
      color: var(--muted);
    }
    .speed-control select {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 4px 6px;
      font-size: 12px;
      cursor: pointer;
    }
    .volume-control {
      display: flex;
      gap: 6px;
      align-items: center;
      font-size: 12px;
      color: var(--muted);
    }
    .volume-control input[type="range"] {
      width: 80px;
      cursor: pointer;
    }
    .volume-control span {
      font-variant-numeric: tabular-nums;
      min-width: 36px;
      text-align: right;
    }
    .player-header button {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
    }
    .player-header button:hover:not(:disabled) {
      color: var(--text);
      border-color: var(--text);
    }
    .player-header button:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }
    #stopJamBtn:hover:not(:disabled) {
      color: var(--error);
      border-color: var(--error);
    }
    .player-area iframe {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      border: 0;
    }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <h3 class="sidebar-title">Jam Playlists</h3>
      <ul class="playlist-list" id="playlistList"></ul>
      <button type="button" class="new-list-btn" id="newListBtn">+ New playlist</button>
      <h3 class="sidebar-title sidebar-title-settings sidebar-bottom-anchor">Settings</h3>
      <label class="sidebar-setting">
        <span class="toggle">
          <input type="checkbox" id="loopPlaylistCheckbox">
          <span class="toggle-slider"></span>
        </span>
        Loop playlist
      </label>
      <h3 class="sidebar-title sidebar-title-settings">Tools</h3>
      <div class="tools-row">
        <button type="button" class="export-btn" id="exportListBtn">Export</button>
        <button type="button" class="import-btn" id="importListBtn">Import</button>
      </div>
    </aside>
    <main>
    <section class="player-area" id="playerArea" hidden>
      <div class="player-header">
        <strong id="playerNowPlaying">Now jamming</strong>
        <div class="player-controls">
          <label class="speed-control">
            Speed
            <select id="jamSpeedSelect"></select>
          </label>
          <label class="volume-control">
            Vol
            <input type="range" id="jamVolumeSlider" min="0" max="100" value="100">
            <span id="jamVolumeValue">100%</span>
          </label>
          <button type="button" id="jamPrevBtn" disabled>‹ Prev</button>
          <button type="button" id="jamNextBtn" disabled>Next ›</button>
          <button type="button" id="stopJamBtn">Stop</button>
        </div>
      </div>
      <div id="playerMount"></div>
    </section>

    <h1>Youtube Jam Buddy</h1>
    <p class="subtitle">Paste a YouTube URL to add it to your jam list. Saved locally in your browser.</p>

    <form class="add-form" id="addForm">
      <input
        type="url"
        id="urlInput"
        placeholder="https://www.youtube.com/watch?v=..."
        autocomplete="off"
        required
      />
      <button type="submit" id="addBtn">Add</button>
    </form>
    <div class="status info" id="status"></div>

    <button type="button" class="jam-btn" id="jamBtn" hidden>Let's Jam</button>

    <div class="list-header" id="listHeader"></div>
    <ul class="list" id="list"></ul>
    <div class="empty" id="empty" hidden>No videos yet. Add one above to get started.</div>
    </main>
  </div>

  <script>
    const STORAGE_KEY = "yjb.lists.v1";
    const DEFAULT_LIST_TITLE = "My Jam List";
    const SPEEDS = [0.25, 0.5, 0.75, 1, 1.25, 1.5, 1.75, 2];

    // --- State ---
    // Storage shape: { activeId, lists: [{ id, title, videos }], loopPlaylist }
    // `videos` and `listTitle` are working copies of the active list; saveList
    // syncs them back into the active list entry before writing.
    const initialState = loadState();
    let lists = initialState.lists;
    let activeId = initialState.activeId;
    let loopPlaylist = initialState.loopPlaylist;
    const initialActive = lists.find((l) => l.id === activeId) || lists[0];
    let videos = initialActive.videos;
    let listTitle = initialActive.title;
    let editingId = null;
    let editingTitle = false;
    let draggedId = null;
    let dropTargetId = null;
    let dropPosition = null;

    function newListId() {
      return `list-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
    }

    function defaultState() {
      const id = newListId();
      return { activeId: id, lists: [{ id, title: DEFAULT_LIST_TITLE, videos: [] }], loopPlaylist: false };
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return defaultState();
        const parsed = JSON.parse(raw);
        if (!parsed || !Array.isArray(parsed.lists) || parsed.lists.length === 0) {
          return defaultState();
        }
        const lists = parsed.lists.map((l) => ({
          id: typeof l?.id === "string" && l.id ? l.id : newListId(),
          title: typeof l?.title === "string" && l.title ? l.title : DEFAULT_LIST_TITLE,
          videos: Array.isArray(l?.videos) ? l.videos : [],
        }));
        const activeId = typeof parsed.activeId === "string" && lists.some((l) => l.id === parsed.activeId)
          ? parsed.activeId
          : lists[0].id;
        return { activeId, lists, loopPlaylist: parsed.loopPlaylist === true };
      } catch {
        return defaultState();
      }
    }

    function saveList() {
      const active = lists.find((l) => l.id === activeId);
      if (active) {
        active.videos = videos;
        active.title = listTitle;
      }
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({ activeId, lists, loopPlaylist }));
        return true;
      } catch (err) {
        const isQuota =
          err && (
            err.name === "QuotaExceededError" ||
            err.name === "NS_ERROR_DOM_QUOTA_REACHED" ||
            err.code === 22 ||
            err.code === 1014
          );
        setStatus(
          isQuota
            ? "Browser storage is full — change not saved. Remove a video and try again."
            : `Could not save: ${err && err.message ? err.message : err}`,
          "error"
        );
        const restored = loadState();
        lists = restored.lists;
        activeId = restored.activeId;
        loopPlaylist = restored.loopPlaylist;
        const restoredActive = lists.find((l) => l.id === activeId);
        videos = restoredActive ? restoredActive.videos : [];
        listTitle = restoredActive ? restoredActive.title : DEFAULT_LIST_TITLE;
        render();
        return false;
      }
    }

    // --- IFrame API loader (only used by the jam player for setPlaybackRate) ---
    let ytApiPromise = null;
    function ensureYtApi() {
      if (ytApiPromise) return ytApiPromise;
      ytApiPromise = new Promise((resolve) => {
        if (window.YT && window.YT.Player) return resolve();
        window.onYouTubeIframeAPIReady = () => resolve();
        const tag = document.createElement("script");
        tag.src = "https://www.youtube.com/iframe_api";
        document.head.appendChild(tag);
      });
      return ytApiPromise;
    }

    // --- Time helpers (HH:MM:SS <-> seconds) ---
    const TIME_PATTERN = /^(\d{1,2}):([0-5]?\d):([0-5]?\d)$/;

    function parseTimeToSeconds(input) {
      if (!input) return null;
      const m = input.trim().match(TIME_PATTERN);
      if (!m) return null;
      return (+m[1]) * 3600 + (+m[2]) * 60 + (+m[3]);
    }

    function formatSecondsToTime(seconds) {
      if (seconds == null) return "";
      const h = Math.floor(seconds / 3600);
      const m = Math.floor((seconds % 3600) / 60);
      const s = Math.floor(seconds % 60);
      const pad = (n) => String(n).padStart(2, "0");
      return `${pad(h)}:${pad(m)}:${pad(s)}`;
    }

    // --- URL parsing ---
    function extractVideoId(url) {
      try {
        const u = new URL(url);
        if (u.hostname === "youtu.be") {
          return u.pathname.slice(1).split("/")[0] || null;
        }
        if (u.hostname.endsWith("youtube.com") || u.hostname.endsWith("youtube-nocookie.com")) {
          if (u.pathname === "/watch") return u.searchParams.get("v");
          const parts = u.pathname.split("/").filter(Boolean);
          // /embed/<id>, /shorts/<id>, /v/<id>, /live/<id>
          if (["embed", "shorts", "v", "live"].includes(parts[0]) && parts[1]) {
            return parts[1];
          }
        }
        return null;
      } catch {
        return null;
      }
    }

    // --- Existence check via YouTube oEmbed ---
    // 200 = valid (returns title, thumbnail, etc); 400/401/404 = invalid/private.
    async function verifyVideo(videoId) {
      const watchUrl = `https://www.youtube.com/watch?v=${encodeURIComponent(videoId)}`;
      const oembedUrl = `https://www.youtube.com/oembed?url=${encodeURIComponent(watchUrl)}&format=json`;
      const res = await fetch(oembedUrl);
      if (!res.ok) {
        throw new Error(res.status === 401 ? "Video is private" : "Video not found");
      }
      const data = await res.json();
      return { videoId, title: data.title || videoId };
    }

    // --- Rendering ---
    const listEl = document.getElementById("list");
    const listHeader = document.getElementById("listHeader");
    const playlistList = document.getElementById("playlistList");
    const newListBtn = document.getElementById("newListBtn");
    const exportListBtn = document.getElementById("exportListBtn");
    const importListBtn = document.getElementById("importListBtn");
    const loopPlaylistCheckbox = document.getElementById("loopPlaylistCheckbox");
    loopPlaylistCheckbox.checked = loopPlaylist;
    const emptyEl = document.getElementById("empty");
    const jamBtn = document.getElementById("jamBtn");
    const playerArea = document.getElementById("playerArea");
    const playerMount = document.getElementById("playerMount");
    const playerNowPlaying = document.getElementById("playerNowPlaying");
    const stopJamBtn = document.getElementById("stopJamBtn");
    const jamPrevBtn = document.getElementById("jamPrevBtn");
    const jamNextBtn = document.getElementById("jamNextBtn");
    const jamSpeedSelect = document.getElementById("jamSpeedSelect");
    const jamVolumeSlider = document.getElementById("jamVolumeSlider");
    const jamVolumeValue = document.getElementById("jamVolumeValue");

    for (const s of SPEEDS) {
      const opt = document.createElement("option");
      opt.value = String(s);
      opt.textContent = `${s}×`;
      jamSpeedSelect.appendChild(opt);
    }

    function render() {
      renderSidebar();
      renderListHeader();
      listEl.replaceChildren();
      const hasVideos = videos.length > 0;
      emptyEl.hidden = hasVideos;
      jamBtn.hidden = !hasVideos;
      jamBtn.textContent = listTitle === DEFAULT_LIST_TITLE
        ? "Let's Jam"
        : `Let's Jam with ${listTitle}`;
      for (const v of videos) {
        listEl.appendChild(renderItem(v));
      }
    }

    function renderSidebar() {
      playlistList.replaceChildren();
      for (const list of lists) {
        const li = document.createElement("li");
        const btn = document.createElement("button");
        btn.type = "button";
        const titleEl = document.createElement("span");
        titleEl.className = "playlist-title";
        titleEl.textContent = list.title;
        const count = list.id === activeId ? videos.length : list.videos.length;
        const countEl = document.createElement("span");
        countEl.className = "count";
        countEl.textContent = String(count);
        btn.append(titleEl, countEl);
        if (list.id === activeId) btn.classList.add("active");
        btn.addEventListener("click", () => switchActiveList(list.id));
        if (list.id !== activeId) attachSidebarDropHandlers(btn, list.id);
        li.appendChild(btn);
        playlistList.appendChild(li);
      }
    }

    function switchActiveList(id) {
      if (id === activeId) return;
      const next = lists.find((l) => l.id === id);
      if (!next) return;

      const currentActive = lists.find((l) => l.id === activeId);
      if (currentActive) {
        currentActive.videos = videos;
        currentActive.title = listTitle;
      }

      activeId = id;
      videos = next.videos;
      listTitle = next.title;
      editingId = null;
      editingTitle = false;

      if (jamPlayer) stopJam();

      saveList();
      render();
    }

    function createList() {
      const currentActive = lists.find((l) => l.id === activeId);
      if (currentActive) {
        currentActive.videos = videos;
        currentActive.title = listTitle;
      }

      const id = newListId();
      const created = { id, title: DEFAULT_LIST_TITLE, videos: [] };
      lists.push(created);
      activeId = id;
      videos = created.videos;
      listTitle = created.title;
      editingId = null;
      editingTitle = false;

      if (jamPlayer) stopJam();

      saveList();
      render();
    }

    function deleteList(id) {
      const list = lists.find((l) => l.id === id);
      if (!list) return;
      if (!confirm(`Delete "${list.title}"?`)) return;

      const wasActive = id === activeId;
      const idx = lists.findIndex((l) => l.id === id);
      lists.splice(idx, 1);

      if (wasActive) {
        const nextActive = lists[Math.min(idx, lists.length - 1)];
        activeId = nextActive.id;
        videos = nextActive.videos;
        listTitle = nextActive.title;
        editingId = null;
        editingTitle = false;
        if (jamPlayer) stopJam();
      }

      saveList();
      render();
    }

    function renderListHeader() {
      listHeader.replaceChildren();

      if (!editingTitle) {
        const titleEl = document.createElement("h2");
        titleEl.textContent = listTitle;

        const actions = document.createElement("div");
        actions.className = "item-actions";

        const editBtn = document.createElement("button");
        editBtn.type = "button";
        editBtn.textContent = "Edit";
        editBtn.addEventListener("click", () => { editingTitle = true; render(); });

        actions.append(editBtn);

        if (lists.length > 1) {
          const deleteBtn = document.createElement("button");
          deleteBtn.type = "button";
          deleteBtn.className = "danger";
          deleteBtn.textContent = "Delete";
          deleteBtn.addEventListener("click", () => deleteList(activeId));
          actions.append(deleteBtn);
        }

        listHeader.append(titleEl, actions);
        return;
      }

      const form = document.createElement("form");
      const input = document.createElement("input");
      input.type = "text";
      input.value = listTitle;
      input.required = true;

      const actions = document.createElement("div");
      actions.className = "item-actions";

      const saveBtn = document.createElement("button");
      saveBtn.type = "submit";
      saveBtn.className = "primary";
      saveBtn.textContent = "Save";

      const cancelBtn = document.createElement("button");
      cancelBtn.type = "button";
      cancelBtn.textContent = "Cancel";
      cancelBtn.addEventListener("click", () => { editingTitle = false; render(); });

      actions.append(saveBtn, cancelBtn);
      form.append(input, actions);

      form.addEventListener("submit", (e) => {
        e.preventDefault();
        listTitle = input.value.trim() || DEFAULT_LIST_TITLE;
        saveList();
        editingTitle = false;
        render();
      });

      listHeader.appendChild(form);
    }

    function renderItem(v) {
      const li = document.createElement("li");
      li.className = "item";
      li.dataset.id = v.id;
      li.draggable = editingId !== v.id;

      const handle = document.createElement("span");
      handle.className = "drag-handle";
      handle.setAttribute("aria-hidden", "true");
      handle.title = "Drag to reorder or move to another playlist";
      handle.textContent = "⋮⋮";

      const thumb = document.createElement("img");
      thumb.className = "item-thumb";
      thumb.src = `https://i.ytimg.com/vi/${encodeURIComponent(v.videoId)}/mqdefault.jpg`;
      thumb.alt = v.title;
      thumb.loading = "lazy";

      const meta = document.createElement("div");
      meta.className = "item-meta";
      meta.append(editingId === v.id ? renderEditForm(v) : renderViewMeta(v));

      li.append(handle, thumb, meta);
      attachDragHandlers(li, v);
      return li;
    }

    function attachDragHandlers(li, v) {
      li.addEventListener("dragstart", (e) => {
        if (!li.draggable) return;
        draggedId = v.id;
        li.classList.add("dragging");
        e.dataTransfer.effectAllowed = "move";
        e.dataTransfer.setData("text/plain", v.id);
      });

      li.addEventListener("dragend", () => {
        li.classList.remove("dragging");
        clearDropIndicators();
        draggedId = null;
      });

      li.addEventListener("dragover", (e) => {
        if (!draggedId || draggedId === v.id) return;
        e.preventDefault();
        e.dataTransfer.dropEffect = "move";
        const rect = li.getBoundingClientRect();
        const newPos = e.clientY < rect.top + rect.height / 2 ? "above" : "below";
        if (dropTargetId === v.id && dropPosition === newPos) return;
        clearDropIndicators();
        li.classList.add(newPos === "above" ? "drop-above" : "drop-below");
        dropTargetId = v.id;
        dropPosition = newPos;
      });

      li.addEventListener("drop", (e) => {
        if (!draggedId || draggedId === v.id) return;
        e.preventDefault();
        const before = dropPosition === "above";
        const movedId = draggedId;
        clearDropIndicators();
        reorderVideos(movedId, v.id, before);
      });
    }

    function clearDropIndicators() {
      for (const el of document.querySelectorAll(".drop-above, .drop-below, .drop-target")) {
        el.classList.remove("drop-above", "drop-below", "drop-target");
      }
      dropTargetId = null;
      dropPosition = null;
    }

    function attachSidebarDropHandlers(btn, targetListId) {
      btn.addEventListener("dragover", (e) => {
        if (!draggedId) return;
        e.preventDefault();
        e.dataTransfer.dropEffect = "move";
        if (btn.classList.contains("drop-target")) return;
        clearDropIndicators();
        btn.classList.add("drop-target");
      });
      btn.addEventListener("dragleave", (e) => {
        if (e.relatedTarget && btn.contains(e.relatedTarget)) return;
        btn.classList.remove("drop-target");
      });
      btn.addEventListener("drop", (e) => {
        if (!draggedId) return;
        e.preventDefault();
        const movedId = draggedId;
        clearDropIndicators();
        moveVideoToList(movedId, targetListId);
      });
    }

    function moveVideoToList(videoId, targetListId) {
      const idx = videos.findIndex((v) => v.id === videoId);
      if (idx === -1) return;
      const target = lists.find((l) => l.id === targetListId);
      if (!target || target.id === activeId) return;
      const [moved] = videos.splice(idx, 1);
      target.videos.push(moved);
      if (editingId === videoId) editingId = null;
      if (!saveList()) return;
      render();
    }

    function reorderVideos(fromId, toId, before) {
      const fromIdx = videos.findIndex((v) => v.id === fromId);
      if (fromIdx === -1) return;
      const next = videos.slice();
      const [moved] = next.splice(fromIdx, 1);
      let toIdx = next.findIndex((v) => v.id === toId);
      if (toIdx === -1) return;
      if (!before) toIdx += 1;
      next.splice(toIdx, 0, moved);
      videos = next;
      if (!saveList()) return;
      render();
    }

    function renderViewMeta(v) {
      const frag = document.createDocumentFragment();

      const title = document.createElement("div");
      title.className = "item-title";
      title.textContent = v.title;
      if (v.playbackRate && v.playbackRate !== 1) {
        const badge = document.createElement("span");
        badge.className = "speed-badge";
        badge.textContent = `${v.playbackRate}×`;
        title.appendChild(badge);
      }
      if (typeof v.volume === "number" && v.volume !== 100) {
        const badge = document.createElement("span");
        badge.className = "speed-badge";
        badge.textContent = `${v.volume}%`;
        title.appendChild(badge);
      }

      const urlEl = document.createElement("div");
      urlEl.className = "item-url";
      urlEl.textContent = v.url;

      frag.append(title, urlEl);

      if (v.startSeconds != null || v.endSeconds != null) {
        const range = document.createElement("div");
        range.className = "item-range";
        const start = v.startSeconds != null ? formatSecondsToTime(v.startSeconds) : "00:00:00";
        const end = v.endSeconds != null ? formatSecondsToTime(v.endSeconds) : "end";
        range.textContent = `${start} → ${end}`;
        frag.appendChild(range);
      }

      const actions = document.createElement("div");
      actions.className = "item-actions";

      const playBtn = document.createElement("button");
      playBtn.type = "button";
      playBtn.className = "primary";
      playBtn.textContent = "▶ Play";
      playBtn.addEventListener("click", () => playVideoEntry(v.id));

      const editBtn = document.createElement("button");
      editBtn.type = "button";
      editBtn.textContent = "Edit";
      editBtn.addEventListener("click", () => { editingId = v.id; render(); });

      const removeBtn = document.createElement("button");
      removeBtn.type = "button";
      removeBtn.className = "danger";
      removeBtn.textContent = "Remove";
      removeBtn.addEventListener("click", () => removeVideo(v.id));

      actions.append(playBtn, editBtn, removeBtn);
      frag.append(actions);
      return frag;
    }

    function renderEditForm(v) {
      const form = document.createElement("form");
      form.className = "edit-form";

      const titleLabel = document.createElement("label");
      titleLabel.textContent = "Title";
      const titleInput = document.createElement("input");
      titleInput.type = "text";
      titleInput.value = v.title;
      titleInput.required = true;
      titleLabel.appendChild(titleInput);

      const speedLabel = document.createElement("label");
      speedLabel.textContent = "Playback speed";
      const speedSelect = document.createElement("select");
      const currentRate = v.playbackRate || 1;
      for (const s of SPEEDS) {
        const opt = document.createElement("option");
        opt.value = String(s);
        opt.textContent = `${s}×`;
        if (s === currentRate) opt.selected = true;
        speedSelect.appendChild(opt);
      }
      speedLabel.appendChild(speedSelect);

      const volumeLabel = document.createElement("label");
      volumeLabel.style.display = "flex";
      volumeLabel.style.flexDirection = "column";
      volumeLabel.style.gap = "4px";
      const volumeLabelText = document.createElement("span");
      const currentVolume = typeof v.volume === "number" ? v.volume : 100;
      volumeLabelText.textContent = `Volume — ${currentVolume}%`;
      const volumeInput = document.createElement("input");
      volumeInput.type = "range";
      volumeInput.min = "0";
      volumeInput.max = "100";
      volumeInput.value = String(currentVolume);
      volumeInput.addEventListener("input", () => {
        volumeLabelText.textContent = `Volume — ${volumeInput.value}%`;
      });
      volumeLabel.append(volumeLabelText, volumeInput);

      const timeRow = document.createElement("div");
      timeRow.className = "edit-form-row";

      const startLabel = document.createElement("label");
      startLabel.textContent = "Start (HH:MM:SS)";
      const startInput = document.createElement("input");
      startInput.type = "text";
      startInput.placeholder = "00:00:00";
      startInput.value = v.startSeconds != null ? formatSecondsToTime(v.startSeconds) : "";
      startLabel.appendChild(startInput);

      const endLabel = document.createElement("label");
      endLabel.textContent = "End (HH:MM:SS)";
      const endInput = document.createElement("input");
      endInput.type = "text";
      endInput.placeholder = "leave blank for end";
      endInput.value = v.endSeconds != null ? formatSecondsToTime(v.endSeconds) : "";
      endLabel.appendChild(endInput);

      timeRow.append(startLabel, endLabel);

      const errorEl = document.createElement("div");
      errorEl.className = "edit-form-error";

      const actions = document.createElement("div");
      actions.className = "item-actions";

      const saveBtn = document.createElement("button");
      saveBtn.type = "submit";
      saveBtn.className = "primary";
      saveBtn.textContent = "Save";

      const cancelBtn = document.createElement("button");
      cancelBtn.type = "button";
      cancelBtn.textContent = "Cancel";
      cancelBtn.addEventListener("click", () => { editingId = null; render(); });

      actions.append(saveBtn, cancelBtn);
      form.append(titleLabel, speedLabel, timeRow, volumeLabel, errorEl, actions);

      form.addEventListener("submit", (e) => {
        e.preventDefault();
        errorEl.textContent = "";

        const newTitle = titleInput.value.trim() || v.title;
        const newRate = parseFloat(speedSelect.value) || 1;

        const startStr = startInput.value.trim();
        const endStr = endInput.value.trim();
        let startSec = null;
        let endSec = null;
        if (startStr) {
          startSec = parseTimeToSeconds(startStr);
          if (startSec === null) {
            errorEl.textContent = "Start must be in HH:MM:SS format (e.g. 00:01:30).";
            return;
          }
        }
        if (endStr) {
          endSec = parseTimeToSeconds(endStr);
          if (endSec === null) {
            errorEl.textContent = "End must be in HH:MM:SS format (e.g. 00:03:00).";
            return;
          }
        }
        if (startSec != null && endSec != null && endSec <= startSec) {
          errorEl.textContent = "End must be after start.";
          return;
        }

        const newVolume = parseInt(volumeInput.value, 10);

        videos = videos.map((x) =>
          x.id === v.id
            ? { ...x, title: newTitle, playbackRate: newRate, volume: newVolume, startSeconds: startSec, endSeconds: endSec }
            : x
        );
        if (!saveList()) return;
        if (isVideoCurrentlyPlaying(v.videoId)) {
          try { jamPlayer.setPlaybackRate(newRate); } catch (_) {}
          try { jamPlayer.setVolume(newVolume); } catch (_) {}
          jamVolumeSlider.value = String(newVolume);
          jamVolumeValue.textContent = `${newVolume}%`;
        }
        editingId = null;
        render();
      });

      return form;
    }

    function removeVideo(id) {
      videos = videos.filter((v) => v.id !== id);
      if (editingId === id) editingId = null;
      saveList();
      render();
    }

    // --- Playback ---
    // Self-managed queue: loadVideoById per item with optional start/end seconds,
    // advance on ENDED. Snapshot at start so list edits don't shift indices mid-jam.
    let jamPlayer = null;
    let jamQueue = [];
    let jamIndex = 0;

    async function playVideoEntry(id) {
      const idx = videos.findIndex((v) => v.id === id);
      if (idx === -1) return;
      if (jamPlayer) {
        jamQueue = videos.slice();
        jamIndex = idx;
        loadJamItem(jamIndex);
        playerArea.scrollIntoView({ behavior: "smooth", block: "start" });
      } else {
        await startJam(idx);
      }
    }

    async function startJam(startIndex) {
      if (videos.length === 0) return;
      await ensureYtApi();

      jamQueue = videos.slice();
      const idx = typeof startIndex === "number" ? startIndex : 0;
      jamIndex = Math.max(0, Math.min(idx, jamQueue.length - 1));

      playerMount.replaceChildren();
      const host = document.createElement("div");
      playerMount.appendChild(host);

      playerArea.hidden = false;
      playerArea.scrollIntoView({ behavior: "smooth", block: "start" });

      stopJamPlayer();
      jamPlayer = new YT.Player(host, {
        width: "100%",
        height: "100%",
        playerVars: { rel: 0 },
        events: {
          onReady: () => loadJamItem(jamIndex),
          onStateChange: (e) => {
            if (e.data === YT.PlayerState.PLAYING) applyCurrentSettings(e);
            else if (e.data === YT.PlayerState.ENDED) advanceJam();
          },
        },
      });
    }

    function loadJamItem(index) {
      const v = jamQueue[index];
      if (!v || !jamPlayer) return;
      const args = { videoId: v.videoId };
      if (v.startSeconds != null) args.startSeconds = v.startSeconds;
      if (v.endSeconds != null) args.endSeconds = v.endSeconds;
      try { jamPlayer.loadVideoById(args); } catch (_) {}
      playerNowPlaying.textContent = v.title;
      updateNavButtons();
    }

    function advanceJam() {
      if (jamQueue.length === 0) return;
      const nextIndex = jamIndex + 1;
      if (nextIndex >= jamQueue.length) {
        if (!loopPlaylist) {
          updateNavButtons();
          return;
        }
        jamIndex = 0;
      } else {
        jamIndex = nextIndex;
      }
      loadJamItem(jamIndex);
    }

    function updateNavButtons() {
      const active = !!jamPlayer && jamQueue.length > 0;
      jamPrevBtn.disabled = !active || jamIndex <= 0;
      jamNextBtn.disabled = !active || (!loopPlaylist && jamIndex >= jamQueue.length - 1);
    }

    function currentJamVideo() {
      return jamQueue[jamIndex] || null;
    }

    function applyCurrentSettings(e) {
      const v = currentJamVideo();
      const latest = v ? videos.find((x) => x.id === v.id) || v : null;
      const rate = latest && latest.playbackRate ? latest.playbackRate : 1;
      const volume = latest && typeof latest.volume === "number" ? latest.volume : 100;
      try { e.target.setPlaybackRate(rate); } catch (_) {}
      try { e.target.setVolume(volume); } catch (_) {}
      jamSpeedSelect.value = String(rate);
      jamVolumeSlider.value = String(volume);
      jamVolumeValue.textContent = `${volume}%`;
    }

    function isVideoCurrentlyPlaying(videoId) {
      const v = currentJamVideo();
      return !!v && v.videoId === videoId;
    }

    function stopJamPlayer() {
      if (jamPlayer) {
        try { jamPlayer.destroy(); } catch (_) {}
        jamPlayer = null;
      }
    }

    function stopJam() {
      stopJamPlayer();
      jamQueue = [];
      jamIndex = 0;
      playerMount.replaceChildren();
      playerArea.hidden = true;
      playerNowPlaying.textContent = "Now jamming";
      updateNavButtons();
    }

    jamBtn.addEventListener("click", () => startJam(0));
    stopJamBtn.addEventListener("click", stopJam);
    newListBtn.addEventListener("click", createList);
    exportListBtn.addEventListener("click", exportActiveList);
    importListBtn.addEventListener("click", importLists);
    loopPlaylistCheckbox.addEventListener("change", () => {
      loopPlaylist = loopPlaylistCheckbox.checked;
      saveList();
      updateNavButtons();
    });

    async function importLists() {
      let file = null;
      if (window.showOpenFilePicker) {
        try {
          const [handle] = await window.showOpenFilePicker({
            multiple: false,
            types: [{ description: "JSON file", accept: { "application/json": [".json"] } }],
          });
          file = await handle.getFile();
        } catch (err) {
          if (err && err.name === "AbortError") return;
          setStatus(`Could not open file: ${err && err.message ? err.message : err}`, "error");
          return;
        }
      } else {
        file = await new Promise((resolve) => {
          const inp = document.createElement("input");
          inp.type = "file";
          inp.accept = "application/json,.json";
          inp.addEventListener("change", () => resolve(inp.files && inp.files[0] || null));
          inp.click();
        });
        if (!file) return;
      }

      let parsed;
      try {
        parsed = JSON.parse(await file.text());
      } catch {
        setStatus("Could not import: file is not valid JSON.", "error");
        return;
      }

      // Accept either { lists: [...] } or a single { title, videos } object.
      const incoming = Array.isArray(parsed?.lists)
        ? parsed.lists
        : (parsed && Array.isArray(parsed.videos) ? [parsed] : null);
      if (!incoming || incoming.length === 0) {
        setStatus("Could not import: no playlists found in file.", "error");
        return;
      }

      // Sync working copies into the active list before mutating `lists`.
      const active = lists.find((l) => l.id === activeId);
      if (active) {
        active.videos = videos;
        active.title = listTitle;
      }

      const normalized = incoming.map((l) => ({
        id: newListId(),
        title: typeof l?.title === "string" && l.title ? l.title : DEFAULT_LIST_TITLE,
        videos: Array.isArray(l?.videos) ? l.videos : [],
      }));
      lists.push(...normalized);

      if (!saveList()) return;
      setStatus(
        `Imported ${normalized.length} playlist${normalized.length === 1 ? "" : "s"}.`,
        "success"
      );
      render();
    }

    async function exportActiveList() {
      // Sync working copies into the active list before exporting.
      const active = lists.find((l) => l.id === activeId);
      if (active) {
        active.videos = videos;
        active.title = listTitle;
      }

      const data = { lists: lists.map((l) => ({ id: l.id, title: l.title, videos: l.videos })) };
      const json = JSON.stringify(data, null, 2);
      const filename = "jam-playlists.json";
      const successMsg = `Exported ${lists.length} playlist${lists.length === 1 ? "" : "s"}.`;

      if (window.showSaveFilePicker) {
        try {
          const handle = await window.showSaveFilePicker({
            suggestedName: filename,
            types: [{ description: "JSON file", accept: { "application/json": [".json"] } }],
          });
          const writable = await handle.createWritable();
          await writable.write(new Blob([json], { type: "application/json" }));
          await writable.close();
          setStatus(successMsg, "success");
          return;
        } catch (err) {
          if (err && err.name === "AbortError") return;
          setStatus(`Could not export: ${err && err.message ? err.message : err}`, "error");
          return;
        }
      }

      const blob = new Blob([json], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      setStatus(successMsg, "success");
    }

    jamPrevBtn.addEventListener("click", () => {
      if (!jamPlayer || jamIndex <= 0) return;
      jamIndex -= 1;
      loadJamItem(jamIndex);
    });

    jamNextBtn.addEventListener("click", () => {
      if (!jamPlayer || jamQueue.length === 0) return;
      if (jamIndex >= jamQueue.length - 1) {
        if (!loopPlaylist) return;
        jamIndex = 0;
      } else {
        jamIndex += 1;
      }
      loadJamItem(jamIndex);
    });

    jamSpeedSelect.addEventListener("change", () => {
      if (!jamPlayer) return;
      const current = currentJamVideo();
      if (!current) return;
      const newRate = parseFloat(jamSpeedSelect.value) || 1;

      videos = videos.map((x) =>
        x.id === current.id ? { ...x, playbackRate: newRate } : x
      );
      saveList();
      try { jamPlayer.setPlaybackRate(newRate); } catch (_) {}
      if (editingId === null) render();
    });

    jamVolumeSlider.addEventListener("input", () => {
      const newVolume = parseInt(jamVolumeSlider.value, 10);
      jamVolumeValue.textContent = `${newVolume}%`;
      if (!jamPlayer) return;
      const current = currentJamVideo();
      if (!current) return;
      videos = videos.map((x) =>
        x.id === current.id ? { ...x, volume: newVolume } : x
      );
      try { jamPlayer.setVolume(newVolume); } catch (_) {}
    });

    jamVolumeSlider.addEventListener("change", () => {
      saveList();
      if (editingId === null) render();
    });

    // --- Add flow ---
    const form = document.getElementById("addForm");
    const input = document.getElementById("urlInput");
    const addBtn = document.getElementById("addBtn");
    const statusEl = document.getElementById("status");

    function setStatus(text, kind = "info") {
      statusEl.textContent = text;
      statusEl.className = `status ${kind}`;
    }

    setStatus("", "info");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const url = input.value.trim();
      if (!url) return;

      const videoId = extractVideoId(url);
      if (!videoId) {
        setStatus("That doesn't look like a YouTube URL.", "error");
        return;
      }

      if (videos.some((v) => v.videoId === videoId)) {
        setStatus("That video is already in your list.", "error");
        return;
      }

      addBtn.disabled = true;
      setStatus("Verifying video…", "info");

      try {
        const { title } = await verifyVideo(videoId);
        const entry = {
          id: `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
          videoId,
          url,
          title,
          addedAt: new Date().toISOString(),
        };
        videos.push(entry);
        if (!saveList()) return;
        render();
        input.value = "";
        setStatus(`Added "${title}".`, "success");
      } catch (err) {
        setStatus(`Could not add: ${err.message}`, "error");
      } finally {
        addBtn.disabled = false;
      }
    });

    render();
  </script>
</body>
</html>
